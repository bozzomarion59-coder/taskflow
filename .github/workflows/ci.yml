name: CI

on:
  pull_request:          # toutes les PR, sans filtre
  push:
    branches: [main]     # et chaque push sur main

permissions:
  contents: read         # la CI lit le code, elle n'écrit rien

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false        # on garde le verdict des deux versions même si l'une échoue
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: api   # les commandes "run" partent de api/
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: api/package-lock.json   # depuis la RACINE
      - name: Installer les dépendances
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Vérifier le format (Prettier)
        run: npm run format:check
      - name: Tests unitaires avec couverture
        run: npm run test:coverage