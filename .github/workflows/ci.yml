name: CI

on:
  pull_request:          # toutes les PR, sans filtre
  push:
    branches: [main]     # et chaque push sur main

permissions:
  contents: read         # la CI lit le code, elle n'écrit rien

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false        # on garde le verdict des deux versions même si l'une échoue
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: api   # les commandes "run" partent de api/
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: api/package-lock.json   # depuis la RACINE
      - name: Installer les dépendances
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Vérifier le format (Prettier)
        run: npm run format:check
      - name: Tests unitaires avec couverture
        run: npm run test:coverage

  api-integration:
    name: api-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow       # base jetable, pas un secret
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432                   # les steps tournent sur la VM : il faut publier le port
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://taskflow:taskflow@localhost:5432/taskflow   # visible de tous les steps
    defaults:
      run:
        working-directory: api
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Tests d'intégration (PostgreSQL)
        run: npm run test:int

  front:
    name: front
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
         run:
          working-directory: front
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Vérifier le format (Prettier)
        run: npm run format:check
      - name: Tests
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Conserver le build (artefact front-dist)
        uses: actions/upload-artifact@v7
        with:
          name: front-dist
          path: front/dist/          # depuis la RACINE : upload-artifact ignore working-directory
          retention-days: 7
          if-no-files-found: error   # le job échoue si le dossier est vide