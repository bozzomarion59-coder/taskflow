global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Boîte blanche : l'API expose ses propres métriques.
  - job_name: taskflow-api
    static_configs:
      - targets: ["api:3000"]
        labels:
          env: prod

  # Boîte noire : on sonde /health à travers le front, comme un utilisateur.
  - job_name: blackbox-health
    metrics_path: /probe
    params:
      module: [http_health]
    static_configs:
      - targets: ["http://front/health"]
        labels:
          env: prod
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # L'exporter blackbox lui-même.
  - job_name: blackbox
    static_configs:
      - targets: ["blackbox:9115"]
