groups:
  # Recording rules : on précalcule les indicateurs RED, le dashboard les relit.
  - name: taskflow-red
    rules:
      - record: taskflow:http_requests:rate5m
        expr: sum by (job, env) (rate(http_requests_total{job="taskflow-api"}[5m]))

      - record: taskflow:http_errors:ratio5m
        expr: |
          sum by (job, env) (rate(http_requests_total{job="taskflow-api", status_code=~"5.."}[5m]))
          /
          sum by (job, env) (rate(http_requests_total{job="taskflow-api"}[5m]))

      - record: taskflow:http_request_duration_seconds:p95_5m
        expr: |
          histogram_quantile(0.95,
            sum by (job, env, le) (rate(http_request_duration_seconds_bucket{job="taskflow-api"}[5m])))

  - name: taskflow-alerts
    rules:
      # Alerte toujours active : prouve que la chaîne Prometheus -> Alertmanager vit.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "La chaîne d'alerte fonctionne (alerte volontairement permanente)."

      # Le test d'un utilisateur : /health à travers le front doit répondre "ok".
      - alert: TaskFlowApiDown
        expr: probe_success{job="blackbox-health"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "L'API TaskFlow ne répond plus ({{ $labels.env }})"
          description: "La sonde de {{ $labels.instance }} échoue depuis plus d'une minute (/health ne renvoie pas status ok)."
          runbook_url: "https://github.com/bozzomarion59-coder/taskflow/blob/main/docs/INCIDENTS.md"

      - alert: TaskFlowMetricsUnreachable
        expr: up{job="taskflow-api"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Les métriques de l'API sont illisibles ({{ $labels.env }})"

      - alert: TaskFlowHighErrorRate
        expr: taskflow:http_errors:ratio5m > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Plus de 5 % de réponses 5xx sur l'API ({{ $labels.env }})"

      - alert: TaskFlowHighLatency
        expr: taskflow:http_request_duration_seconds:p95_5m > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Le p95 de latence de l'API dépasse 1 s ({{ $labels.env }})"
