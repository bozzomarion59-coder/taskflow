# Configuration Nginx du conteneur "front".
# Rôle : (1) servir le site compilé, (2) transmettre /api et /health à l'API,
#        (3) ajouter les en-têtes de sécurité HTTP (Jour 5, DevSecOps).
# C'est ce "reverse proxy" qui remplace le proxy de Vite utilisé en développement.
#
# Ce fichier est un "template" : ${NGINX_LOCAL_RESOLVERS} est remplacé au démarrage
# du conteneur par l'adresse du serveur DNS du réseau Docker (voir Dockerfile).
# Il est inclus dans le bloc http {} de l'image nginx : on peut donc y déclarer un map.

# Cache-Control selon le chemin. Pourquoi un map plutôt qu'un add_header dans
# "location /assets/" ? Parce qu'add_header N'EST PAS HÉRITÉ : dès qu'une location
# contient son propre add_header, elle perd TOUS ceux du niveau server (dont la CSP).
# Une valeur vide = en-tête non envoyé.
map $uri $taskflow_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ne pas annoncer la version de Nginx (en-tête Server et pages d'erreur) :
    # inutile de dire à un attaquant quelle CVE chercher.
    server_tokens off;

    # ---------- En-têtes de sécurité (s'appliquent à TOUTES les réponses) ------
    # "always" : aussi sur les erreurs (404, 502...), pas seulement sur les 2xx/3xx.
    #
    # CSP : le navigateur ne charge QUE ce qui vient de notre origine. Le build Vite
    # ne produit ni script ni style inline (vérifié dans dist/index.html), donc
    # pas besoin de 'unsafe-inline'. connect-src 'self' : fetch('/api/...') autorisé.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Le navigateur ne "devine" pas le type d'un fichier (pas de JS déguisé en image).
    add_header X-Content-Type-Options "nosniff" always;
    # Anti-clickjacking pour les vieux navigateurs (frame-ancestors le fait pour les récents).
    add_header X-Frame-Options "DENY" always;
    # On n'envoie pas l'URL complète aux sites tiers.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # L'application n'utilise ni caméra, ni micro, ni géolocalisation : on les coupe.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Isolation de l'origine (protection Spectre, fenêtres ouvertes par un autre site).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    # Pas de HSTS ici : ce Nginx parle HTTP. HSTS se pose sur le proxy HTTPS de prod.
    add_header Cache-Control $taskflow_cache_control;

    # Express ajoute "X-Powered-By: Express" : on le retire des réponses proxifiées
    # (la vraie correction est app.disable('x-powered-by') dans l'API).
    proxy_hide_header X-Powered-By;

    # DNS utilisé pour retrouver l'adresse du service "api". valid=10s : on
    # re-demande l'adresse toutes les 10 s. Sans cela, Nginx mémoriserait l'IP de l'API
    # une fois pour toutes : après un redéploiement de l'API (nouveau conteneur, donc
    # parfois nouvelle IP), il enverrait ses requêtes dans le vide -> erreur 502.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    # Le nom "api" est celui du service dans compose.yaml : le réseau Docker le résout.
    # On le met dans une variable pour que Nginx le résolve à chaque requête
    # (et pas une seule fois au démarrage).
    set $api_upstream http://api:3000;

    # Limite la taille des requêtes (le titre d'une tâche fait 200 caractères max).
    client_max_body_size 16k;

    # Les appels /api/... partent vers l'API (le chemin est transmis tel quel).
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /health aussi : pratique pour le smoke test et la supervision depuis l'extérieur.
    location = /health {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # Tout le reste : les fichiers du site. Si le fichier n'existe pas, on renvoie
    # index.html (utile pour les applications à une seule page).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers générés par Vite ont un nom contenant un hash : ils peuvent être
    # gardés très longtemps en cache (Cache-Control posé par le map ci-dessus).
    # Pas d'add_header ici (sinon les en-têtes de sécurité disparaîtraient), ni
    # d'"expires" (il ajouterait un second Cache-Control). Un fichier absent donne
    # une vraie 404 au lieu de index.html.
    location /assets/ {
        try_files $uri =404;
    }
}
